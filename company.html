<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14' font-size='14'>📈</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <div id="compInfo"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script type="module">
    import { CompanyInfo } from "./js/CompanyInfo.js";

    const params = new URLSearchParams(location.search);
    const symbol = params.get("symbol");

    const compInfo = new CompanyInfo(document.getElementById("compInfo"), symbol);
    await compInfo.load();
    await compInfo.addChart();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Exchange</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14' font-size='14'>📈</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="marquee"></div>

  <main class="card">
    <div id="compareBar" class="compare-bar hidden"></div>
    <h2 class="page-title">Search Nasdaq Stocks</h2>
    <div id="form"></div>
    <div id="results"></div>
  </main>

  <script type="module">
    import { Marquee } from "./js/Marquee.js";
    import { SearchForm } from "./js/SearchForm.js";
    import { SearchResult } from "./js/SearchResult.js";
    import { CompareList } from "./js/CompareList.js";

    const marquee = new Marquee(document.getElementById("marquee"));
    marquee.load();

    const form = new SearchForm(document.getElementById("form"));
    const results = new SearchResult(document.getElementById("results"));
    const compareList = new CompareList(document.getElementById("compareBar"));

    // Form hands the found companies + query over to the results view
    form.onSearch((companies, query) => {
      results.renderResults(companies, query);
    });

    // Clicking Compare adds the company to the comparison bar (max 3)
    results.onCompare((company) => {
      const added = compareList.add(company);
      // Already at the limit and it's a new company: flash the bar
      if (!added && !compareList.has(company.symbol)) {
        compareList.flashFull();
      }
    });
  </script>
</body>
</html>

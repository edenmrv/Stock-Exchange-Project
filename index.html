<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Exchange</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='0' y='14' font-size='14'>📈</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="marquee"></div>

  <main class="card">
    <h2 class="page-title">Search Nasdaq Stocks</h2>
    <div id="form"></div>
    <div id="results"></div>
  </main>

  <script type="module">
    import { Marquee } from "./js/Marquee.js";
    import { SearchForm } from "./js/SearchForm.js";
    import { SearchResult } from "./js/SearchResult.js";

    const marquee = new Marquee(document.getElementById("marquee"));
    marquee.load();

    const form = new SearchForm(document.getElementById("form"));
    const results = new SearchResult(document.getElementById("results"));

    // Form hands the found companies + query over to the results view
    form.onSearch((companies, query) => {
      results.renderResults(companies, query);
    });

    // For now just log the clicked company - we'll use it in a later step
    results.onCompare((company) => {
      console.log("Compare clicked:", company);
    });
  </script>
</body>
</html>
